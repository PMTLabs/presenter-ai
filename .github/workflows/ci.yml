name: CI

on:
  push:
    branches:
      - master
      - develop
      - "feature/**"
  pull_request:

jobs:
  dotnet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: secrets-guard selftest
        run: bash scripts/secrets-guard.selftest.sh

      - name: secrets-guard
        run: bash scripts/secrets-guard.sh

      - name: compose-config
        run: docker compose config -q

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: NuGet cache
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', 'PresenterAi.slnx', 'Directory.Build.props') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - run: dotnet restore
      - run: dotnet build -c Release -warnaserror --no-restore

      - name: dotnet test
        run: dotnet test -c Release --no-build --logger "trx" --results-directory TestResults

      - name: Upload TestResults
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: TestResults
          path: TestResults

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # hashFiles() is evaluated on the runner, so the guard must run after checkout (a job-level
      # `if` would always see an empty tree and skip the job forever).
      - name: check web workspace
        id: web
        run: echo "exists=$([ -f web/package.json ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - uses: oven-sh/setup-bun@v2
        if: steps.web.outputs.exists == 'true'
        with:
          bun-version: 1.3.14

      - name: bun install
        if: steps.web.outputs.exists == 'true'
        working-directory: web
        run: bun install --frozen-lockfile

      - name: bun lint
        if: steps.web.outputs.exists == 'true'
        working-directory: web
        run: bun run lint

      - name: bun build
        if: steps.web.outputs.exists == 'true'
        working-directory: web
        run: bun run build

      - name: openapi-drift
        if: steps.web.outputs.exists == 'true'
        run: |
          cd web
          bun run generate:api
          cd ..
          git diff --exit-code -- web/shared/src/api
